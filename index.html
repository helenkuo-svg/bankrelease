<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>銀行出納放行申請</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root {
  --bg: #f4f3ef;
  --card: #ffffff;
  --border: #e2dfd8;
  --text: #1a1a1a;
  --sub: #888;
  --green: #2d6e2d;
  --green-bg: #e8f4e8;
  --red-bg: #fce8e8;
  --red: #a32d2d;
  --blue: #1a6fb5;
  --radius: 12px;
  --radius-sm: 8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:1.5rem 1rem;}
.wrap{max-width:620px;margin:0 auto;}
header{margin-bottom:1.5rem;}
header h1{font-size:19px;font-weight:600;}
header p{font-size:12px;color:var(--sub);margin-top:3px;}

/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:1.25rem;}
.tab{padding:7px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;border:0.5px solid var(--border);background:var(--card);color:var(--sub);transition:all .15s;}
.tab.on{background:var(--text);color:#fff;border-color:transparent;}
.page{display:none;}
.page.on{display:block;}

/* Card */
.card{background:var(--card);border:0.5px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem;}
.card-title{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin-bottom:12px;}

/* Grid */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.full{grid-column:1/-1;}
.fld{display:flex;flex-direction:column;gap:4px;}
.lbl{font-size:11px;color:var(--sub);font-weight:500;}
input,select,textarea{border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;font-size:14px;color:var(--text);background:#fafaf8;width:100%;outline:none;font-family:inherit;transition:border-color .15s;}
input:focus,select:focus,textarea:focus{border-color:#999;background:#fff;}
textarea{resize:vertical;min-height:72px;}

/* Upload */
.upbox{border:1.5px dashed var(--border);border-radius:var(--radius-sm);padding:1.25rem;text-align:center;cursor:pointer;background:#fafaf8;transition:border-color .15s,background .15s;user-select:none;}
.upbox:hover,.upbox.drag{border-color:#aaa;background:#f0efe9;}
.upbox.ok{border-color:var(--green);background:var(--green-bg);}
.upbox-icon{font-size:22px;margin-bottom:6px;}
.upbox-label{font-size:13px;color:#555;font-weight:500;}
.upbox-sub{font-size:11px;color:var(--sub);margin-top:3px;}
.upbox-file{font-size:12px;color:var(--green);margin-top:4px;font-weight:500;}

/* Status */
.st{font-size:13px;padding:8px 12px;border-radius:var(--radius-sm);margin-top:8px;display:none;}
.st.ok{display:block;color:var(--green);background:var(--green-bg);}
.st.err{display:block;color:var(--red);background:var(--red-bg);}
.st.ld{display:block;color:#666;background:#f0f0f0;}

/* Parsed rows */
.prows{margin-top:10px;display:none;}
.prow{display:flex;gap:8px;padding:7px 10px;background:#fafaf8;border:0.5px solid var(--border);border-radius:var(--radius-sm);margin-bottom:5px;font-size:13px;}
.prow-n{flex:1;color:var(--text);}
.prow-a{color:#555;min-width:110px;text-align:right;}

/* Hint */
.hint{background:var(--bg);border-radius:var(--radius-sm);padding:9px 12px;font-size:13px;color:var(--sub);margin-top:8px;}
.hint strong{color:var(--text);}

/* Preview */
.preview{background:#fafaf8;border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:1rem;font-size:13px;line-height:1.9;white-space:pre-wrap;min-height:80px;font-family:"Menlo","Courier New",monospace;}

/* Buttons */
.brow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.btn{border:0.5px solid var(--border);border-radius:var(--radius-sm);background:var(--card);padding:8px 16px;font-size:13px;color:var(--text);cursor:pointer;font-family:inherit;transition:background .12s;}
.btn:hover{background:var(--bg);}
.btn:active{transform:scale(.98);}
.btn-dark{background:var(--text);color:#fff;border-color:transparent;font-weight:500;}
.btn-dark:hover{background:#333;}
.btn-dark:disabled{opacity:.35;cursor:not-allowed;}

/* List */
.rec{border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;background:var(--card);display:flex;gap:10px;align-items:flex-start;}
.rec-info{flex:1;}
.rec-title{font-size:14px;font-weight:500;margin-bottom:3px;}
.rec-meta{font-size:12px;color:var(--sub);line-height:1.8;}
.rec-meta a{color:var(--blue);text-decoration:none;}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;margin-top:4px;}
.b-red{background:var(--red-bg);color:var(--red);}
.b-yellow{background:#fffbea;color:#7a6200;}
.b-green{background:var(--green-bg);color:var(--green);}
.btn-done{background:var(--green-bg);color:var(--green);border-color:transparent;font-size:12px;padding:6px 11px;white-space:nowrap;}
.empty{text-align:center;padding:2rem;color:#bbb;font-size:14px;}
.lst-st{font-size:13px;padding:7px 12px;border-radius:var(--radius-sm);display:none;margin-bottom:10px;}
.lst-st.ld{display:block;color:#666;background:#f0f0f0;}
.lst-st.err{display:block;color:var(--red);background:var(--red-bg);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>銀行出納放行申請</h1>
    <p>詠鑠生活股份有限公司</p>
  </header>

  <div class="tabs">
    <div class="tab on" onclick="switchTab('form')">新增申請</div>
    <div class="tab" onclick="switchTab('list')">待放行清單</div>
  </div>

  <!-- 新增申請 -->
  <div class="page on" id="pg-form">

    <!-- PDF 上傳 -->
    <div class="card">
      <p class="card-title">上傳銀行文件自動填入</p>
      <div class="upbox" id="pdf-box" onclick="document.getElementById('pdf-file').click()">
        <div class="upbox-icon">📄</div>
        <div class="upbox-label">點擊選擇 / 拖曳 PDF 或圖片</div>
        <div class="upbox-sub">支援 合庫 · 兆豐 · 中國信託 · 永豐 PDF；JPG/PNG 請手動填入</div>
        <div class="upbox-file" id="pdf-file-name"></div>
        <input type="file" id="pdf-file" accept=".pdf,.jpg,.jpeg,.png" style="display:none" onchange="onFileChosen()"/>
      </div>
      <div class="st" id="parse-st"></div>
      <div class="prows" id="prows"></div>
    </div>

    <!-- 申請資訊 -->
    <div class="card">
      <p class="card-title">申請資訊（可修改）</p>
      <div class="g2">
        <div class="fld">
          <label class="lbl">銀行名稱</label>
          <select id="bank">
            <option>合庫</option>
            <option>兆豐銀行</option>
            <option>中國信託</option>
            <option>永豐銀行</option>
          </select>
        </div>
        <div class="fld">
          <label class="lbl">幣別</label>
          <select id="currency">
            <option>NTD</option><option>AUD</option><option>NZD</option>
            <option>USD</option><option>EUR</option>
          </select>
        </div>
        <div class="fld full">
          <label class="lbl">Trans # / 交易批號 / 案件編號</label>
          <input id="trans" placeholder="例：000000079 / 20260328NAP3388182"/>
        </div>
        <div class="fld">
          <label class="lbl">總金額</label>
          <input id="amount" type="number" placeholder="10000000"/>
        </div>
        <div class="fld">
          <label class="lbl">Value Date / 交易日期</label>
          <input id="valuedate" type="date"/>
        </div>
        <div class="fld full">
          <label class="lbl">受款方</label>
          <textarea id="payee" placeholder="自動填入或手動輸入"></textarea>
        </div>
        <div class="fld full">
          <label class="lbl">備註（選填）</label>
          <textarea id="note" placeholder="如有特殊說明請填寫" style="min-height:50px;"></textarea>
        </div>
      </div>
    </div>

    <!-- 截圖上傳 -->
    <div class="card">
      <p class="card-title">附件上傳（選填）</p>
      <div class="fld">
        <label class="lbl">銀行待放行截圖</label>
        <div class="upbox" id="img-box" onclick="document.getElementById('img-file').click()">
          <div class="upbox-label">點擊選擇 / 拖曳 / Ctrl+V 貼上截圖</div>
          <div class="upbox-file" id="img-file-name"></div>
          <input type="file" id="img-file" accept="image/*" style="display:none" onchange="onImgChosen()"/>
        </div>
      </div>
    </div>

    <!-- 提醒設定 -->
    <div class="card">
      <p class="card-title">提醒設定</p>
      <div class="fld">
        <label class="lbl">提醒 Email（你自己的信箱）</label>
        <input id="remind-email" type="email" placeholder="your@email.com"/>
      </div>
      <div class="hint" id="remind-hint">填入 Value Date 後，自動計算提醒日期</div>
    </div>

    <!-- 訊息預覽 -->
    <div class="card">
      <p class="card-title">訊息預覽</p>
      <div class="preview" id="preview">請填寫上方欄位或上傳文件…</div>
      <div class="brow">
        <button class="btn btn-dark" id="submit-btn" onclick="doSubmit()">上傳並送出</button>
        <button class="btn" onclick="doCopy()">複製訊息</button>
        <button class="btn" onclick="doClear()">清除</button>
      </div>
      <div class="st" id="submit-st"></div>
    </div>
  </div>

  <!-- 待放行清單 -->
  <div class="page" id="pg-list">
    <div class="card">
      <p class="card-title">待放行清單</p>
      <div class="lst-st" id="lst-st"></div>
      <div id="rec-list"><div class="empty">載入中…</div></div>
    </div>
  </div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const GAS='https://script.google.com/macros/s/AKfycbx2dFQR2aPC4vrxXXyzOCHoR4pYulJAP33CKAZCU26GASvXA7bEwrdl1oTi1eeL9lmudg/exec';

let pdfB64='',pdfName='',imgB64='',imgName='',imgUrl='',pdfUrl='';
let parsedPayees=[];

// ── Tab ──
function switchTab(t){
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('on',(i===0&&t==='form')||(i===1&&t==='list')));
  document.getElementById('pg-form').classList.toggle('on',t==='form');
  document.getElementById('pg-list').classList.toggle('on',t==='list');
  if(t==='list') loadList();
}

// ── 拖曳 PDF ──
const pdfBox=document.getElementById('pdf-box');
pdfBox.addEventListener('dragover',e=>{e.preventDefault();pdfBox.classList.add('drag');});
pdfBox.addEventListener('dragleave',()=>pdfBox.classList.remove('drag'));
pdfBox.addEventListener('drop',e=>{
  e.preventDefault();pdfBox.classList.remove('drag');
  const f=e.dataTransfer.files[0];if(!f)return;
  const dt=new DataTransfer();dt.items.add(f);
  document.getElementById('pdf-file').files=dt.files;
  onFileChosen();
});

// ── 拖曳截圖 ──
const imgBox=document.getElementById('img-box');
imgBox.addEventListener('dragover',e=>{e.preventDefault();imgBox.classList.add('drag');});
imgBox.addEventListener('dragleave',()=>imgBox.classList.remove('drag'));
imgBox.addEventListener('drop',e=>{
  e.preventDefault();imgBox.classList.remove('drag');
  const f=e.dataTransfer.files[0];if(!f)return;
  loadImgFile(f);
});

// ── Ctrl+V 貼上截圖 ──
document.addEventListener('paste',e=>{
  const items=e.clipboardData&&e.clipboardData.items;
  if(!items)return;
  for(let i=0;i<items.length;i++){
    if(items[i].type.startsWith('image/')){
      const f=items[i].getAsFile();
      if(f){loadImgFile(f);break;}
    }
  }
});

// ── 檔案選擇 ──
function onFileChosen(){
  const f=document.getElementById('pdf-file').files[0];
  if(!f)return;
  const isImg=f.type.startsWith('image/');
  readFileB64(f,b64=>{
    pdfB64=b64;pdfName=f.name;pdfUrl='';
    pdfBox.classList.add('ok');
    document.getElementById('pdf-file-name').textContent='✓ '+f.name;
    if(isImg){
      showSt('parse-st','ok','✓ 圖片已載入，請手動填入欄位');
      return;
    }
    parsePDF(f);
  });
}

function onImgChosen(){
  const f=document.getElementById('img-file').files[0];
  if(!f)return;
  loadImgFile(f);
}

function loadImgFile(f){
  readFileB64(f,b64=>{
    imgB64=b64;imgName=f.name||'screenshot.png';imgUrl='';
    imgBox.classList.add('ok');
    document.getElementById('img-file-name').textContent='✓ '+imgName;
  });
}

function readFileB64(f,cb){
  const r=new FileReader();
  r.onload=e=>cb(e.target.result);
  r.readAsDataURL(f);
}

// ── PDF 解析 ──
async function parsePDF(file){
  showSt('parse-st','ld','讀取中…');
  try{
    const buf=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:buf}).promise;
    let allLines=[];
    let txt='';
    for(let i=1;i<=pdf.numPages;i++){
      const pg=await pdf.getPage(i);
      const ct=await pg.getTextContent();
      // 依 Y 座標分組，重建行結構
      const byY={};
      ct.items.forEach(item=>{
        const y=Math.round(item.transform[5]);
        if(!byY[y])byY[y]=[];
        byY[y].push({x:item.transform[4],str:item.str});
      });
      const sortedY=Object.keys(byY).map(Number).sort((a,b)=>b-a);
      sortedY.forEach(y=>{
        const row=byY[y].sort((a,b)=>a.x-b.x).map(i=>i.str.trim()).filter(s=>s).join(' ');
        if(row){allLines.push(row);txt+=row+'\n';}
      });
    }
    const r=extract(txt,allLines);
    if(r){
      fill(r);
      showSt('parse-st','ok',`✓ 解析完成！${r.payees.length>0?`找到 ${r.payees.length} 筆，總金額 ${r.currency} ${Number(r.totalAmount).toLocaleString()}`:'請確認欄位資料'}`);
      if(r.payees.length>0) showProws(r.payees);
    }else{
      showSt('parse-st','err','無法自動解析，請手動填入欄位');
    }
  }catch(e){
    showSt('parse-st','err','讀取失敗：'+e.message);
  }
}

// ── 全球金融網格式解析（支援合庫 & 兆豐）──
function extractGlobalEBanking(lines){
  const isMega=lines.some(l=>/Mega International|兆豐/i.test(l));
  const transactions=[];
  let valueDate='';

  for(let i=0;i<lines.length;i++){
    const m=lines[i].match(/^(\d{9})\s+\S+$/);
    if(!m||i<3)continue;
    const batchNo=m[1];

    if(isMega){
      // 兆豐格式: i-2='TWD', i-1 starts with '限公司'
      if(!/^TWD$/.test(lines[i-2]||'')||!/^限公司/.test(lines[i-1]||''))continue;
      // 收款方名稱: line i-3
      const line3=lines[i-3]||'';
      let payeeName=line3.includes(' ')?line3.split(' ').slice(1).join(' ').trim():line3;
      // 補上 i-1 的後綴 (e.g. "限公司 司" → "司")
      const line1parts=(lines[i-1]||'').split(/\s+/);
      if(line1parts.length>1)payeeName+=''.concat(...line1parts.slice(1));
      // 金額: i+1 (純數字) 或 i+2 (末尾)
      const amtM1=(lines[i+1]||'').match(/^([\d,]+\.00)$/);
      const amtM2=(lines[i+2]||'').match(/([\d,]+\.00)$/);
      const amount=amtM1?parseFloat(amtM1[1].replace(/,/g,'')):amtM2?parseFloat(amtM2[1].replace(/,/g,'')):0;
      // 付款日期: 往後找
      for(let j=i+1;j<=Math.min(i+5,lines.length-1);j++){
        const dm=(lines[j]||'').match(/(\d{4}\/\d{2}\/\d{2})/);
        if(dm){if(!valueDate)valueDate=dm[1].replace(/\//g,'-');break;}
      }
      if(payeeName&&amount>0)transactions.push({name:payeeName,amount,currency:'NTD',batchNo});
    }else{
      // 合庫格式: i-1 含付款+收款方名稱
      if(i+5>=lines.length)continue;
      const linePrev=lines[i-1];
      const lineC=lines[i+2];
      const lineD=lines[i+3];
      const lineF=lines[i+5];
      const payeeName=linePrev.includes(' ')?linePrev.split(' ').slice(1).join(' ').trim():linePrev;
      const dateM=lineC.match(/(\d{4}\/\d{2}\/\d{2})/);
      if(dateM&&!valueDate)valueDate=dateM[1].replace(/\//g,'-');
      const amtM=lineD.match(/([\d,]+\.00)$/);
      const amount=amtM?parseFloat(amtM[1].replace(/,/g,'')):0;
      const accts=lineF.trim().split(/\s+/);
      const payeeAcct=accts.length>1?accts[1]:'';
      if(payeeName&&amount>0)transactions.push({name:payeeName,amount,currency:'NTD',acct:payeeAcct,batchNo});
    }
  }

  if(transactions.length===0)return null;
  const totalAmount=transactions.reduce((s,t)=>s+t.amount,0);
  const allBatch=transactions.map(t=>t.batchNo).join(' / ');
  return{
    bank:isMega?'兆豐銀行':'合庫',
    currency:'NTD',valueDate,totalAmount,
    payees:transactions.map(t=>({name:t.name,amount:t.amount,currency:'NTD'})),
    trans:allBatch
  };
}

function extract(text,lines){
  try{
    // 全球金融網格式
    if(/全球.{0,3}金融網|global.{0,5}ebanking/i.test(text)&&lines&&lines.length>0){
      return extractGlobalEBanking(lines);
    }
    const n=text.replace(/\s+/g,' ');

    // 銀行
    let bank='兆豐銀行';
    if(/合作金庫|合庫|TAIWAN COOPERATIVE/i.test(n))bank='合庫';
    else if(/兆豐|Mega/i.test(n))bank='兆豐銀行';
    else if(/中國信託|CTBC/i.test(n))bank='中國信託';
    else if(/永豐|Sinopac/i.test(n))bank='永豐銀行';

    // 幣別
    let currency='NTD';
    const cm=n.match(/幣別[^A-Z]{0,20}(TWD|USD|AUD|NZD|EUR)/)||
              n.match(/交易金額[^A-Z]{0,5}(TWD|USD|AUD|NZD|EUR)/)||
              n.match(/總金額[^A-Z]{0,20}(TWD|USD|AUD|NZD|EUR)/)||
              n.match(/(AUD|USD|NZD|EUR)\s+[\d,]+\.\d{2}/);
    if(cm)currency=cm[1]==='TWD'?'NTD':cm[1];

    // Value Date
    let valueDate='';
    const allDates=(n.match(/\d{4}[\/\-]\d{2}[\/\-]\d{2}/g)||[]).map(d=>d.replace(/\//g,'-'));
    if(allDates.length>0){
      // 永豐/中信：找「交易日期」後面的日期
      const vdM=n.match(/(?:交易日期|付款日期|扣款日期)[^\d]{0,10}(\d{4}[\/\-]\d{2}[\/\-]\d{2})/);
      if(vdM){
        valueDate=vdM[1].replace(/\//g,'-');
      }else{
        const dc={};
        allDates.forEach(d=>{dc[d]=(dc[d]||0)+1;});
        const sorted=Object.entries(dc).sort((a,b)=>b[1]-a[1]);
        valueDate=sorted[0][1]>1?sorted[0][0]:allDates[allDates.length-1];
      }
    }

    // 總金額
    let totalAmount=0;
    const tm=n.match(/總金額[^\d]{0,50}([\d,]+\.\d{2})/)||
              n.match(/交易金額[^\d]{0,20}([\d,]+(?:,\d{3})*(?:\.\d{2})?)/)||
              n.match(/待放行\s+\d+\s+(?:AUD|USD|NZD|EUR|TWD)\s+([\d,]+\.\d{2})/);
    if(tm)totalAmount=parseFloat(tm[1].replace(/,/g,''));

    // Trans #
    let trans='';
    const trM=n.match(/(\d{8}[A-Z]{3}\d+)/)||  // 合庫: 20260328NAP3388182
               n.match(/案件編號[^\d]{0,5}(\d{10,})/)||  // 永豐/中信
               n.match(/(?:Trans|交易批號)[^\d]{0,5}(\d{6,})/i);
    if(trM)trans=trM[1];

    // 受款方 — 英文（合庫）
    const payees=[];const seen=new Set();
    const engM=n.match(/[A-Z][A-Z &]{3,}(?:PTY LTD|LTD|CO\.|INC|CORP|LIMITED|COMPANY)/g)||[];
    engM.forEach(name=>{
      const c=name.trim();
      if(!seen.has(c)&&c.length>3&&!/COMMONWEALTH|ORANGE|BRANCH|BANK/.test(c)){
        seen.add(c);
        const idx=n.indexOf(c);
        const near=n.substring(idx,idx+300);
        const am=near.match(/(AUD|USD|NZD|EUR|TWD)\s*([\d,]+\.\d{2})/);
        if(am){
          payees.push({name:c,amount:parseFloat(am[2].replace(/,/g,'')),currency:am[1]==='TWD'?'NTD':am[1]});
        }
      }
    });

    // 受款方 — 中文（兆豐）
    if(payees.length===0){
      const segs=n.split(/(?=0{5,}\d{3,})/);
      segs.forEach(seg=>{
        const am=seg.match(/(TWD|USD|AUD|NZD|EUR)\s*([\d,]+\.\d{2})/);
        if(!am)return;
        const amt=parseFloat(am[2].replace(/,/g,''));
        if(amt<=0)return;
        const nm=seg.match(/[\u4e00-\u9fff]{2,}(?:股份有限公司|有限公司)/g);
        if(nm){
          const cands=nm.filter(x=>!x.includes('詠鑠'));
          if(cands.length>0){
            const name=cands[0];
            if(!seen.has(name)){seen.add(name);payees.push({name,amount:amt,currency:am[1]==='TWD'?'NTD':am[1]});}
            else{const ex=payees.find(p=>p.name===name);if(ex)ex.amount+=amt;}
          }
        }
      });
    }

    // 受款方 — 永豐/中信（收款人戶名）
    if(payees.length===0){
      const rcvM=n.match(/(?:收款人戶名|收款人名稱|受款人)[^\u4e00-\u9fff]{0,5}([\u4e00-\u9fff]{2,}(?:股份有限公司|有限公司|企業|實業)?)/);
      if(rcvM)payees.push({name:rcvM[1],amount:totalAmount,currency});
    }

    if(!totalAmount&&payees.length>0)totalAmount=payees.reduce((s,p)=>s+p.amount,0);
    return{bank,currency,valueDate,totalAmount,payees,trans};
  }catch(e){return null;}
}

function fill(r){
  const bEl=document.getElementById('bank');
  for(let i=0;i<bEl.options.length;i++)if(bEl.options[i].value===r.bank){bEl.selectedIndex=i;break;}
  const cEl=document.getElementById('currency');
  for(let i=0;i<cEl.options.length;i++)if(cEl.options[i].value===r.currency){cEl.selectedIndex=i;break;}
  if(r.trans)document.getElementById('trans').value=r.trans;
  if(r.totalAmount)document.getElementById('amount').value=r.totalAmount;
  if(r.valueDate)document.getElementById('valuedate').value=r.valueDate;
  parsedPayees=r.payees;
  if(r.payees.length>0)document.getElementById('payee').value=r.payees.map(p=>`${p.name} — ${p.currency} ${Number(p.amount).toLocaleString()}`).join('\n');
  updateReminder();update();
}

function showProws(payees){
  const el=document.getElementById('prows');
  el.style.display='block';
  el.innerHTML=payees.map((p,i)=>`<div class="prow"><span class="prow-n">${i+1}. ${p.name}</span><span class="prow-a">${p.currency} ${Number(p.amount).toLocaleString()}</span></div>`).join('');
}

// ── 欄位事件 ──
['bank','currency','trans','amount','valuedate','payee','note'].forEach(id=>{
  const el=document.getElementById(id);if(!el)return;
  el.addEventListener('input',update);
  if(el.tagName==='SELECT')el.addEventListener('change',update);
});
document.getElementById('valuedate').addEventListener('input',updateReminder);

function getRD(vd){if(!vd)return null;const d=new Date(vd);d.setDate(d.getDate()-2);return d;}
function fmt(d){if(!d)return'';return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

function updateReminder(){
  const vd=document.getElementById('valuedate').value;
  const hint=document.getElementById('remind-hint');
  if(!vd){hint.innerHTML='填入 Value Date 後，自動計算提醒日期';return;}
  const rd=getRD(vd);const today=new Date();today.setHours(0,0,0,0);
  hint.innerHTML=rd<today?`提醒日 <strong>${fmt(rd)}</strong> 已過，將立即寄出提醒`:`Value Date <strong>${vd}</strong>，提醒日：<strong>${fmt(rd)}</strong>（前兩天）`;
}

function getMsg(){
  const bank=document.getElementById('bank').value;
  const cur=document.getElementById('currency').value;
  const trans=document.getElementById('trans').value.trim();
  const amt=document.getElementById('amount').value.trim();
  const vd=document.getElementById('valuedate').value;
  const payee=document.getElementById('payee').value.trim();
  const note=document.getElementById('note').value.trim();
  if(!amt&&!payee)return null;
  let m=`Dear Alden,\nPlease release the following transaction(s), thank you.\n\n`;
  m+=`[Bank] ${bank}\n`;
  if(trans)m+=`[Trans #] ${trans}\n`;
  if(vd)m+=`[Value Date] ${vd}\n`;
  if(amt&&cur)m+=`[Total] ${cur} ${Number(amt).toLocaleString()}${parsedPayees.length>1?` (${parsedPayees.length} transactions)`:''}\n`;
  if(payee){m+=`[Payees]\n`;payee.split('\n').filter(l=>l.trim()).forEach((l,i)=>m+=`  ${i+1}. ${l.trim()}\n`);}
  if(pdfUrl)m+=`[PDF] ${pdfUrl}\n`;
  if(imgUrl)m+=`[Screenshot] ${imgUrl}\n`;
  if(note)m+=`\nNote: ${note}\n`;
  return m;
}

function update(){
  document.getElementById('preview').textContent=getMsg()||'請填寫上方欄位或上傳文件…';
  updateReminder();
}

function doCopy(){
  const m=getMsg();if(!m)return;
  navigator.clipboard.writeText(m).then(()=>showSt('submit-st','ok','已複製！貼到 Google Chat 吧'));
}

function showSt(id,type,text){
  const el=document.getElementById(id);
  el.className=`st ${type}`;el.textContent=text;
  if(type!=='ld')setTimeout(()=>el.className='st',5000);
}

async function doSubmit(){
  const vd=document.getElementById('valuedate').value;
  const email=document.getElementById('remind-email').value.trim();
  if(!vd){showSt('submit-st','err','請填入 Value Date');return;}
  if(!email){showSt('submit-st','err','請填入提醒 Email');return;}
  const btn=document.getElementById('submit-btn');
  btn.disabled=true;showSt('submit-st','ld','上傳中，請稍候…');
  const message=getMsg()||'';
  try{
    const res=await fetch(GAS,{
      method:'POST',
      body:JSON.stringify({
        bank:document.getElementById('bank').value,
        currency:document.getElementById('currency').value,
        amount:document.getElementById('amount').value.trim(),
        trans:document.getElementById('trans').value.trim(),
        payee:document.getElementById('payee').value.trim(),
        valueDate:vd,remindEmail:email,
        note:document.getElementById('note').value.trim(),
        pdfBase64:pdfB64,pdfName,
        imgBase64:imgB64,imgName,
        message
      })
    });
    const data=await res.json();
    if(data.success){
      if(data.pdfUrl){pdfUrl=data.pdfUrl;update();}
      if(data.imgUrl){imgUrl=data.imgUrl;update();}
      const rd=getRD(vd);
      showSt('submit-st','ok',`✓ 已送出！提醒信將於 ${fmt(rd)} 早上 8 點寄出。可複製訊息貼到 Google Chat。`);
    }else{
      showSt('submit-st','err',`失敗：${data.error||'請稍後再試'}`);
    }
  }catch(e){
    showSt('submit-st','err','無法連線，請稍後再試');
  }
  btn.disabled=false;
}

function doClear(){
  ['bank','currency','trans','amount','valuedate','payee','note'].forEach(id=>{
    const el=document.getElementById(id);if(!el)return;
    if(el.tagName==='SELECT')el.selectedIndex=0;else el.value='';
  });
  document.getElementById('remind-email').value='';
  ['pdf-box','img-box'].forEach(id=>document.getElementById(id).classList.remove('ok'));
  document.getElementById('pdf-file-name').textContent='';
  document.getElementById('img-file-name').textContent='';
  document.getElementById('pdf-file').value='';
  document.getElementById('img-file').value='';
  document.getElementById('prows').style.display='none';
  document.getElementById('parse-st').className='st';
  document.getElementById('submit-st').className='st';
  document.getElementById('preview').textContent='請填寫上方欄位或上傳文件…';
  document.getElementById('remind-hint').innerHTML='填入 Value Date 後，自動計算提醒日期';
  pdfB64='';pdfName='';imgB64='';imgName='';imgUrl='';pdfUrl='';parsedPayees=[];
}

// ── 待放行清單 ──
async function loadList(){
  const listEl=document.getElementById('rec-list');
  const stEl=document.getElementById('lst-st');
  stEl.className='lst-st ld';stEl.textContent='載入中…';listEl.innerHTML='';
  try{
    const res=await fetch(`${GAS}?action=list`);
    const data=await res.json();
    stEl.className='lst-st';
    if(!data.success||!data.records||data.records.length===0){
      listEl.innerHTML='<div class="empty">目前沒有待放行的交易 ✅</div>';return;
    }
    listEl.innerHTML=data.records.map(r=>{
      const vd=new Date(r.valueDate);
      const dl=Math.ceil((vd-new Date())/(1000*60*60*24));
      const bc=dl<=0?'b-red':dl<=3?'b-yellow':'b-green';
      const bt=dl<=0?'⚠️ 已逾期':dl===1?'明天到期':`還有 ${dl} 天`;
      return`<div class="rec" id="item-${r.key}">
        <div class="rec-info">
          <div class="rec-title">${r.bank} — ${r.currency} ${Number(r.amount||0).toLocaleString()}</div>
          <div class="rec-meta">
            Value Date：${r.valueDate}<br>
            ${r.trans?`Trans #：${r.trans}<br>`:''}
            ${r.payee?r.payee.split('\n').slice(0,2).join('、')+(r.payee.split('\n').length>2?'…':''):''}
            ${r.pdfUrl?`<br><a href="${r.pdfUrl}" target="_blank">📄 PDF</a>`:''}
            ${r.imgUrl?`　<a href="${r.imgUrl}" target="_blank">🖼 截圖</a>`:''}
          </div>
          <span class="badge ${bc}">${bt}</span>
        </div>
        <button class="btn btn-done" onclick="markDone('${r.key}')">已放行</button>
      </div>`;
    }).join('');
  }catch(e){
    stEl.className='lst-st err';stEl.textContent='載入失敗，請稍後再試';
  }
}

async function markDone(key){
  const item=document.getElementById(`item-${key}`);
  if(item)item.style.opacity='0.4';
  try{
    const res=await fetch(`${GAS}?action=complete&key=${encodeURIComponent(key)}`);
    const data=await res.json();
    if(data.success){
      if(item)item.remove();
      const listEl=document.getElementById('rec-list');
      if(!listEl.querySelector('.rec'))listEl.innerHTML='<div class="empty">目前沒有待放行的交易 ✅</div>';
    }else{if(item)item.style.opacity='1';}
  }catch(e){if(item)item.style.opacity='1';}
}
</script>
